name: Windows 构建

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # 供 release.yml 调用。
  #
  # 让发布流程复用这里，而不是把构建步骤再抄一份——抄一份的话，
  # 以后在一处修了 bug，另一处会悄悄烂掉。
  workflow_call:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: 拉依赖（shared）
        working-directory: packages/shared
        run: dart pub get

      - name: 静态检查（shared）
        working-directory: packages/shared
        run: dart analyze

      - name: 单元测试（shared）
        working-directory: packages/shared
        run: dart test

      - name: 拉依赖（server）
        working-directory: packages/server
        run: dart pub get

      - name: 静态检查（server）
        working-directory: packages/server
        run: dart analyze

      - name: 单元测试（server）
        working-directory: packages/server
        run: dart test

      - name: 构建服务端
        working-directory: packages/server
        run: dart build cli

      - name: 拉依赖
        working-directory: packages/app
        run: flutter pub get

      - name: 静态检查
        working-directory: packages/app
        run: flutter analyze

      - name: 单元测试
        working-directory: packages/app
        run: flutter test

      - name: 构建 Windows Release
        working-directory: packages/app
        run: flutter build windows --release

      - name: 上传客户端
        uses: actions/upload-artifact@v4
        with:
          name: kanban-windows
          path: packages/app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

      - name: 上传服务端
        uses: actions/upload-artifact@v4
        with:
          name: kanban-server-windows
          path: packages/server/build/cli/windows_x64/bundle/
          if-no-files-found: error
          retention-days: 30
