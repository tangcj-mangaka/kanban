name: Android 构建

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Android Gradle 插件要 JDK 17，runner 自带的版本不一定对得上。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # 有正式密钥就用，没有就让 Gradle 退回 debug 签名。
      #
      # 不能直接用 `if: secrets.X != ''`——GitHub 不允许在 job/step 的 if 里
      # 读 secrets。先塞进 env 再在 shell 里判断。
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64，这次用 debug 密钥签名。"
            echo "::warning::debug 密钥每次构建都不同，装新版前需要先卸载旧版。"
            exit 0
          fi

          # 下面每一步都单独报错。原来只有一句 base64 的原始报错，
          # 出问题时看不出到底是哪个 secret 填错了。
          KEYSTORE=packages/app/android/app/release.jks
          # 先把所有空白字符去掉再解码。
          #
          # 从终端里用鼠标选中复制时，很容易把终端按窗口宽度折行产生的
          # 换行、或者行尾的空格一起带进来——那些字符不属于 base64，
          # 解码会直接失败。真正的 base64 里本来就没有空白，删掉是安全的。
          CLEANED=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          if ! printf '%s' "$CLEANED" | base64 -d > "$KEYSTORE" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 解不开（去掉空白后仍然不是合法 base64）。"
            echo "::error::长度 ${#CLEANED} 字符，开头：$(printf '%s' "$CLEANED" | head -c 8)"
            echo "::error::重新生成的办法见 README「安卓客户端的签名」一节。"
            exit 1
          fi
          # 空文件也算「解开了」，得单独拦一道。
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 解出来是空的。"
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::ANDROID_STORE_PASSWORD 是空的（没配，或者名字拼错了）。"
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS 是空的。生成密钥时用的 -alias 是什么就填什么。"
            exit 1
          fi

          # 用 keytool 验一遍：能列出这个 alias，就说明文件是完好的
          # 密钥库、密码对得上、alias 也存在。等到 Gradle 那步才炸的话，
          # 报错埋在几十行 Gradle 输出里，很难看出是密码问题。
          if ! keytool -list -keystore "$KEYSTORE" \
               -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::密钥库打不开。可能是 ANDROID_STORE_PASSWORD 不对，"
            echo "::error::或者 ANDROID_KEY_ALIAS（当前：$KEY_ALIAS）在密钥库里不存在。"
            exit 1
          fi

          cat > packages/app/android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}
          EOF
          echo "已启用正式签名（alias: $KEY_ALIAS）。"

      - name: 拉依赖（shared）
        working-directory: packages/shared
        run: dart pub get

      - name: 拉依赖（app）
        working-directory: packages/app
        run: flutter pub get

      - name: 静态检查
        working-directory: packages/app
        run: flutter analyze

      - name: 单元测试
        working-directory: packages/app
        run: flutter test

      # 出一个通用 APK 而不是按 ABI 拆分：包大一点，但装的时候不用先搞清楚
      # 自己手机是什么架构。个人自用，省事比省几 MB 重要。
      - name: 构建 APK
        working-directory: packages/app
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kanban-android
          path: packages/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 清掉密钥，别留在 runner 的工作区里。
      - name: 清理签名文件
        if: always()
        run: |
          rm -f packages/app/android/app/release.jks
          rm -f packages/app/android/key.properties
