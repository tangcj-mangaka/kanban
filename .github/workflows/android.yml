name: Android 构建

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Android Gradle 插件要 JDK 17，runner 自带的版本不一定对得上。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # 有正式密钥就用，没有就让 Gradle 退回 debug 签名。
      #
      # 不能直接用 `if: secrets.X != ''`——GitHub 不允许在 job/step 的 if 里
      # 读 secrets。先塞进 env 再在 shell 里判断。
      - name: 准备签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64，这次用 debug 密钥签名。"
            echo "::warning::debug 密钥每次构建都不同，装新版前需要先卸载旧版。"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > packages/app/android/app/release.jks
          cat > packages/app/android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "已启用正式签名。"

      - name: 拉依赖（shared）
        working-directory: packages/shared
        run: dart pub get

      - name: 拉依赖（app）
        working-directory: packages/app
        run: flutter pub get

      - name: 静态检查
        working-directory: packages/app
        run: flutter analyze

      - name: 单元测试
        working-directory: packages/app
        run: flutter test

      # 出一个通用 APK 而不是按 ABI 拆分：包大一点，但装的时候不用先搞清楚
      # 自己手机是什么架构。个人自用，省事比省几 MB 重要。
      - name: 构建 APK
        working-directory: packages/app
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kanban-android
          path: packages/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 清掉密钥，别留在 runner 的工作区里。
      - name: 清理签名文件
        if: always()
        run: |
          rm -f packages/app/android/app/release.jks
          rm -f packages/app/android/key.properties
